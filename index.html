<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pesquisas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 650px;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .container:hover {
            transform: translateY(-2px);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #6c7a8a;
            font-size: 16px;
            margin-top: 5px;
        }

        .subtitle {
            text-align: center;
            color: #8a9aa8;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 2px dashed #e9ecef;
            padding-bottom: 15px;
        }

        /* ============================================ */
        /* 🏷️ SEÇÕES POR STATUS */
        /* ============================================ */
        .secao-status {
            margin-bottom: 32px;
            padding: 16px 20px;
            border-radius: 16px;
            background: #fafbfc;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        .secao-status:last-child {
            margin-bottom: 0;
        }

        .secao-status:hover {
            border-color: #d0d5dc;
        }

        .secao-titulo {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            padding: 6px 14px;
            border-radius: 10px;
            display: inline-block;
            text-align: center;
            width: 100%;
        }

        .secao-titulo.ativo {
            color: #155724;
            background: #d4edda;
        }

        .secao-titulo.futura {
            color: #856404;
            background: #fff3cd;
        }

        .secao-titulo.finalizada {
            color: #721c24;
            background: #f8d7da;
        }

        .secao-titulo .contador {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 13px;
            margin-left: 6px;
        }

        .pesquisa-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pesquisa-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 14px 20px;
            text-decoration: none;
            color: #212529;
            transition: all 0.25s ease;
            cursor: pointer;
            text-align: center;
        }

        .pesquisa-item:hover:not(.inativo) {
            background: #ffffff;
            border-color: #2c3e50;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.12);
            transform: scale(1.02);
        }

        .pesquisa-item:active:not(.inativo) {
            transform: scale(0.98);
        }

        .pesquisa-item.inativo {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .pesquisa-item.inativo:hover {
            transform: none;
            box-shadow: none;
        }

        .pesquisa-info .nome {
            font-weight: 600;
            font-size: 16px;
            color: #1a1a2e;
        }

        .pesquisa-info .periodo {
            font-size: 13px;
            color: #8a9aa8;
            margin-top: 2px;
        }

        /* ============================================ */
        /* 📱 DIVISOR ENTRE SEÇÕES */
        /* ============================================ */
        .divisor-secao {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, #d0d5dc, transparent);
            margin: 8px 0 24px 0;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
            color: #adb5bd;
            font-size: 13px;
        }

        .footer a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Mensagem quando não há pesquisas em uma seção */
        .sem-pesquisas {
            color: #adb5bd;
            font-size: 14px;
            text-align: center;
            padding: 12px 0;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
                margin-top: 10px;
            }

            .header h1 {
                font-size: 22px;
            }

            .secao-status {
                padding: 12px 14px;
                margin-bottom: 24px;
            }

            .pesquisa-item {
                padding: 12px 14px;
            }

            .pesquisa-info .nome {
                font-size: 14px;
            }

            .secao-titulo {
                font-size: 14px;
                padding: 6px 12px;
            }
        }

        /* ============================================ */
        /* 🎨 ESTILOS DO MODAL */
        /* ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        .modal-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .modal h3 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 15px;
            color: #6c7a8a;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .modal .periodo-destaque {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 600;
            color: #2c3e50;
            display: inline-block;
            margin: 8px 0 16px 0;
            font-size: 14px;
        }

        .modal-btn {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .modal-btn:hover {
            background: #1a252f;
            transform: scale(1.02);
        }

        .modal-btn:active {
            transform: scale(0.96);
        }

        .modal-btn.finalizada-btn {
            background: #6c757d;
        }

        .modal-btn.finalizada-btn:hover {
            background: #5a6268;
        }

        .modal-btn.futura-btn {
            background: #ffc107;
            color: #212529;
        }

        .modal-btn.futura-btn:hover {
            background: #e0a800;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .modal {
                padding: 24px 20px;
            }

            .modal-icon {
                font-size: 44px;
            }

            .modal h3 {
                font-size: 19px;
            }

            .modal p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📊 <span>Pesquisas 2026</span></h1>
            <p>Selecione uma pesquisa para iniciar a coleta de dados</p>
        </div>

        <div class="subtitle">
            🗂️ Formulários disponíveis
        </div>

        <!-- ============================================ -->
        <!-- 🔹 SEÇÃO: ATIVO -->
        <!-- ============================================ -->
        <div class="secao-status" id="secao-ativo">
            <div class="secao-titulo ativo">
                Ativo <span class="contador" id="contador-ativo">0</span>
            </div>
            <div class="pesquisa-list" id="lista-ativo"></div>
        </div>

        <div class="divisor-secao"></div>

        <!-- ============================================ -->
        <!-- 🔹 SEÇÃO: EM BREVE -->
        <!-- ============================================ -->
        <div class="secao-status" id="secao-futura">
            <div class="secao-titulo futura">
                Em breve <span class="contador" id="contador-futura">0</span>
            </div>
            <div class="pesquisa-list" id="lista-futura"></div>
        </div>

        <div class="divisor-secao"></div>

        <!-- ============================================ -->
        <!-- 🔹 SEÇÃO: FINALIZADAS -->
        <!-- ============================================ -->
        <div class="secao-status" id="secao-finalizada">
            <div class="secao-titulo finalizada">
                Finalizadas <span class="contador" id="contador-finalizada">0</span>
            </div>
            <div class="pesquisa-list" id="lista-finalizada"></div>
        </div>

        <div class="footer">
            <p>Sistema de Pesquisas · <a href="https://github.com/marcosfajunior/pesquisa-app" target="_blank">GitHub</a></p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- 🎨 MODAL -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">🔴</div>
            <h3 id="modalTitulo">Pesquisa Finalizada</h3>
            <p id="modalDescricao">Esta pesquisa já foi concluída e não está mais disponível para coleta de dados.</p>
            <div class="periodo-destaque" id="modalPeriodo">📅 13/08/2026</div>
            <button class="modal-btn" id="modalBtn" onclick="fecharModal()">Entendi</button>
        </div>
    </div>

    <script>
        // ============================================
        // 📋 CONFIGURAÇÃO DAS PESQUISAS
        // ============================================
        const pesquisas = [
            {
                id: 1,
                nome: 'Aracitaba-MG',
                arquivo: 'Pesquisa_Aracitaba.html',
                dataInicio: '2026-08-13',
                dataFim: '2026-08-13'
            },
            {
                id: 2,
                nome: 'Santa Rita de Ibitipoca-MG',
                arquivo: 'Pesquisa_Santa_Rita_de_Ibitipoca.html',
                dataInicio: '2026-08-14',
                dataFim: '2026-08-15'
            },
            {
                id: 3,
                nome: 'Barbacena-MG',
                arquivo: 'Pesquisa_Barbacena.html',
                dataInicio: '2026-08-13',
                dataFim: '2026-08-13'
            },
            {
                id: 4,
                nome: 'Juiz de Fora-MG',
                arquivo: 'Pesquisa_Juiz_de_Fora.html',
                dataInicio: '2026-08-10',
                dataFim: '2026-08-10'
            },
            {
                id: 5,
                nome: 'São Paulo-SP',
                arquivo: 'Pesquisa_Sao_Paulo.html',
                dataInicio: '2026-08-05',
                dataFim: '2026-08-05'
            },
            {
                id: 6,
                nome: 'Rio de Janeiro-RJ',
                arquivo: 'Pesquisa_Rio_de_Janeiro.html',
                dataInicio: '2026-08-08',
                dataFim: '2026-08-08'
            },
            // =============================================
            // 👇 Adicione novas pesquisas abaixo deste ponto
            // =============================================
            // {
            //     id: 7,
            //     nome: 'Nova Cidade-MG',
            //     arquivo: 'Pesquisa_Nova_Cidade.html',
            //     dataInicio: '2026-08-20',
            //     dataFim: '2026-08-20'
            // },
        ];

        // ============================================
        // 🔍 FUNÇÃO PARA VERIFICAR STATUS DA PESQUISA
        // ============================================
        function getStatusPesquisa(dataInicio, dataFim) {
            const hoje = new Date();
            const hojeStr = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
            
            if (hojeStr < dataInicio) {
                return 'futura';
            }
            if (hojeStr > dataFim) {
                return 'finalizada';
            }
            return 'ativa';
        }

        // ============================================
        // 📝 FUNÇÃO PARA FORMATAR DATA PARA EXIBIÇÃO
        // ============================================
        function formatarData(dataStr) {
            const partes = dataStr.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        // ============================================
        // 🎨 FUNÇÕES DO MODAL
        // ============================================
        function abrirModal(tipo, nome, dataInicio, dataFim) {
            const overlay = document.getElementById('modalOverlay');
            const icon = document.getElementById('modalIcon');
            const titulo = document.getElementById('modalTitulo');
            const descricao = document.getElementById('modalDescricao');
            const periodo = document.getElementById('modalPeriodo');
            const btn = document.getElementById('modalBtn');

            const periodoTexto = dataInicio === dataFim 
                ? formatarData(dataInicio) 
                : `${formatarData(dataInicio)} a ${formatarData(dataFim)}`;

            if (tipo === 'finalizada') {
                icon.textContent = '🔴';
                titulo.textContent = 'Pesquisa Finalizada';
                descricao.textContent = `A pesquisa "${nome}" já foi concluída e não está mais disponível para coleta de dados.`;
                btn.className = 'modal-btn finalizada-btn';
                btn.textContent = 'Entendi';
            } else if (tipo === 'futura') {
                icon.textContent = '🟡';
                titulo.textContent = 'Pesquisa em Breve';
                descricao.textContent = `A pesquisa "${nome}" ainda não começou. Aguarde a data de início para participar.`;
                btn.className = 'modal-btn futura-btn';
                btn.textContent = 'Entendi';
            }

            periodo.textContent = `📅 ${periodoTexto}`;
            overlay.classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modalOverlay').classList.remove('ativo');
        }

        // Fechar modal ao clicar fora
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharModal();
            }
        });

        // Fechar modal com tecla ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                fecharModal();
            }
        });

        // ============================================
        // 🚀 FUNÇÃO PARA RENDERIZAR A LISTA DE PESQUISAS
        // ============================================
        function renderizarPesquisas() {
            // Limpar as listas
            document.getElementById('lista-ativo').innerHTML = '';
            document.getElementById('lista-futura').innerHTML = '';
            document.getElementById('lista-finalizada').innerHTML = '';

            // Contadores
            let contAtivo = 0;
            let contFutura = 0;
            let contFinalizada = 0;

            // 🔄 ADICIONAR STATUS A CADA PESQUISA
            const pesquisasComStatus = pesquisas.map(pesquisa => {
                const status = getStatusPesquisa(pesquisa.dataInicio, pesquisa.dataFim);
                return {
                    ...pesquisa,
                    status: status
                };
            });

            // 📊 ORDENAÇÃO HIERÁRQUICA:
            // Ativo: data (mais próxima) → nome
            // Em breve: data (mais próxima) → nome
            // Finalizada: nome (alfabético) → data
            const ordemStatus = { 'ativa': 0, 'futura': 1, 'finalizada': 2 };

            pesquisasComStatus.sort((a, b) => {
                if (ordemStatus[a.status] !== ordemStatus[b.status]) {
                    return ordemStatus[a.status] - ordemStatus[b.status];
                }

                if (a.status === 'finalizada') {
                    if (a.nome !== b.nome) {
                        return a.nome.localeCompare(b.nome);
                    }
                    return a.dataInicio.localeCompare(b.dataInicio);
                } else {
                    if (a.dataInicio !== b.dataInicio) {
                        return a.dataInicio.localeCompare(b.dataInicio);
                    }
                    return a.nome.localeCompare(b.nome);
                }
            });

            // 🎨 DISTRIBUIR PESQUISAS POR SEÇÃO
            pesquisasComStatus.forEach(pesquisa => {
                const status = pesquisa.status;

                let isInativo = false;
                let listaId = '';

                switch (status) {
                    case 'ativa':
                        isInativo = false;
                        listaId = 'lista-ativo';
                        contAtivo++;
                        break;
                    case 'futura':
                        isInativo = true;
                        listaId = 'lista-futura';
                        contFutura++;
                        break;
                    case 'finalizada':
                        isInativo = true;
                        listaId = 'lista-finalizada';
                        contFinalizada++;
                        break;
                }

                const link = document.createElement('a');
                link.className = `pesquisa-item${isInativo ? ' inativo' : ''}`;

                if (isInativo) {
                    link.href = '#';
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        abrirModal(status, pesquisa.nome, pesquisa.dataInicio, pesquisa.dataFim);
                    });
                } else {
                    link.href = pesquisa.arquivo;
                }

                const periodoTexto = pesquisa.dataInicio === pesquisa.dataFim 
                    ? formatarData(pesquisa.dataInicio) 
                    : `${formatarData(pesquisa.dataInicio)} a ${formatarData(pesquisa.dataFim)}`;

                link.innerHTML = `
                    <div class="pesquisa-info">
                        <div class="nome">${pesquisa.nome}</div>
                        <div class="periodo">📅 ${periodoTexto}</div>
                    </div>
                `;

                document.getElementById(listaId).appendChild(link);
            });

            // 📊 ATUALIZAR CONTADORES
            document.getElementById('contador-ativo').textContent = contAtivo;
            document.getElementById('contador-futura').textContent = contFutura;
            document.getElementById('contador-finalizada').textContent = contFinalizada;

            // 🔹 MOSTRAR MENSAGEM QUANDO NÃO HÁ ITENS EM UMA SEÇÃO
            const listas = [
                { id: 'lista-ativo', contador: contAtivo, mensagem: 'Nenhuma pesquisa ativa no momento.' },
                { id: 'lista-futura', contador: contFutura, mensagem: 'Nenhuma pesquisa futura agendada.' },
                { id: 'lista-finalizada', contador: contFinalizada, mensagem: 'Nenhuma pesquisa finalizada.' }
            ];

            listas.forEach(item => {
                const lista = document.getElementById(item.id);
                if (item.contador === 0) {
                    const msg = document.createElement('div');
                    msg.className = 'sem-pesquisas';
                    msg.textContent = item.mensagem;
                    lista.appendChild(msg);
                }
            });
        }

        // 🚀 INICIALIZAR
        document.addEventListener('DOMContentLoaded', renderizarPesquisas);
    </script>

</body>
</html>
