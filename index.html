<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pesquisas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 650px;
            width: 100%;
            transition: transform 0.2s ease;
        }

        .container:hover {
            transform: translateY(-2px);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #6c7a8a;
            font-size: 16px;
            margin-top: 5px;
        }

        .subtitle {
            text-align: center;
            color: #8a9aa8;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 2px dashed #e9ecef;
            padding-bottom: 15px;
        }

        .pesquisa-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pesquisa-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 18px 22px;
            text-decoration: none;
            color: #212529;
            transition: all 0.25s ease;
            position: relative;
        }

        .pesquisa-item:hover {
            background: #ffffff;
            border-color: #2c3e50;
            box-shadow: 0 8px 25px rgba(44, 62, 80, 0.12);
            transform: translateX(6px);
        }

        .pesquisa-item:active {
            transform: scale(0.98);
        }

        .pesquisa-icon {
            font-size: 28px;
            flex-shrink: 0;
            width: 48px;
            text-align: center;
        }

        .pesquisa-info {
            flex: 1;
        }

        .pesquisa-info .nome {
            font-weight: 600;
            font-size: 17px;
            color: #1a1a2e;
        }

        .pesquisa-info .descricao {
            font-size: 14px;
            color: #6c7a8a;
            margin-top: 2px;
        }

        .pesquisa-badge {
            background: #2c3e50;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .pesquisa-badge.ativo {
            background: #28a745;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
            color: #adb5bd;
            font-size: 13px;
        }

        .footer a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .pesquisa-item {
                padding: 14px 16px;
                flex-wrap: wrap;
            }

            .pesquisa-icon {
                font-size: 22px;
                width: 40px;
            }

            .pesquisa-info .nome {
                font-size: 15px;
            }

            .pesquisa-badge {
                font-size: 10px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📊 <span>Pesquisas</span></h1>
            <p>Selecione uma pesquisa para iniciar a coleta de dados</p>
        </div>

        <div class="subtitle">
            🗂️ Formulários disponíveis
        </div>

        <div class="pesquisa-list">
            <!-- Pesquisa Aracitaba -->
            <a href="Pesquisa_Aracitaba.html" class="pesquisa-item">
                <div class="pesquisa-info">
                    <div class="nome">Pesquisa Aracitaba-MG</div>
                </div>
                <span class="pesquisa-badge ativo">Ativo</span>
            </a>

            <!-- Pesquisa Santa Rita de Ibitipoca -->
            <a href="Pesquisa_Santa_Rita_de_Ibitipoca.html" class="pesquisa-item">
                <div class="pesquisa-info">
                    <div class="nome">Pesquisa Santa Rita de Ibitipoca-MG</div>
                </div>
                <span class="pesquisa-badge ativo">Ativo</span>
            </a>

        </div>

        <div class="footer">
            <p>Sistema de Pesquisas · <a href="https://github.com/marcosfajunior/pesquisa-app" target="_blank">GitHub</a></p>
        </div>
    </div>

</body>
</html>
